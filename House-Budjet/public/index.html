<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House Budjet</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">House Budjet</div>
      <nav>
        <button class="nav-btn active" data-page="dashboard">Dashboard</button>
        <button class="nav-btn" data-page="income">Income</button>
        <button class="nav-btn" data-page="expenses">Expenses</button>
        <button class="nav-btn" data-page="report">Report</button>
      </nav>
      <div class="status" id="apiStatus">Connecting…</div>
    </header>

    <main>
      <section id="page-dashboard" class="page">
        <h1>Dashboard</h1>
        <div class="cards">
          <article class="card"><span>Income</span><strong id="dashIncome">0.00</strong></article>
          <article class="card"><span>Expenses</span><strong id="dashExpense">0.00</strong></article>
          <article class="card"><span>Balance</span><strong id="dashBalance">0.00</strong></article>
        </div>
      </section>

      <section id="page-income" class="page hidden">
        <div class="page-head">
          <h1>Income</h1>
        </div>
        <form id="incomeForm" class="inline-form">
          <input type="date" name="date" required>
          <select name="category_id" id="incomeCategory" required></select>
          <input type="number" step="0.01" min="0.01" name="amount" placeholder="Amount" required>
          <input type="text" name="description" placeholder="Description">
          <button type="submit">Add Income</button>
        </form>
        <table>
          <thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Description</th></tr></thead>
          <tbody id="incomeRows"></tbody>
        </table>
      </section>

      <section id="page-expenses" class="page hidden">
        <div class="page-head">
          <h1>Expenses</h1>
          <button id="openExpense" class="primary">Add Expense</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Amount</th>
              <th>VAT</th>
              <th>Supplier</th>
              <th>Proof</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody id="expenseRows"></tbody>
        </table>
      </section>

      <section id="page-report" class="page hidden">
        <h1>Report</h1>
        <table>
          <thead><tr><th>Category</th><th>Total</th></tr></thead>
          <tbody id="reportRows"></tbody>
        </table>
      </section>
    </main>
  </div>

  <div id="expenseModal" class="modal hidden">
    <form id="expenseForm" class="modal-card">
      <h2>Add Expense</h2>
      <label>Date <input type="date" name="date" required></label>
      <label>Category
        <select name="category_id" id="expenseCategory" required></select>
      </label>
      <label>Amount <input type="number" step="0.01" min="0.01" name="amount" required></label>
      <label>VAT amount <input type="number" step="0.01" min="0" name="vat_amount" value="0"></label>
      <label>Supplier
        <select name="supplier_id" id="expenseSupplier"></select>
      </label>
      <label>Proof type
        <select name="proof_type">
          <option value="none">none</option>
          <option value="receipt">receipt</option>
          <option value="invoice">invoice</option>
          <option value="photo">photo</option>
        </select>
      </label>
      <label>Description <input type="text" name="description" placeholder="Optional"></label>
      <p id="expenseError" class="error hidden"></p>
      <div class="modal-actions">
        <button type="button" id="cancelExpense">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
